<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Smart Order Button — ESP32-S3 Hardware Simulation & Test Bench Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React 18 + ReactDOM + Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-space: #050811;
      --bg-surface: rgba(13, 20, 36, 0.78);
      --bg-surface-elevated: rgba(20, 30, 52, 0.88);
      --bg-card: rgba(15, 23, 42, 0.7);
      --border-glass: rgba(56, 189, 248, 0.16);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.45);
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --cyan-glow: #06b6d4;
      --blue-glow: #38bdf8;
      --emerald-glow: #10b981;
      --amber-glow: #f59e0b;
      --rose-glow: #f43f5e;
      --violet-glow: #a855f7;
      --enig-gold: #e2b714;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-space);
      background-image: 
        radial-gradient(circle at 12% 15%, rgba(14, 165, 233, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 88% 22%, rgba(168, 85, 247, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 50%),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 20px 24px 60px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 220px;
      background: radial-gradient(ellipse at top, rgba(56, 189, 248, 0.18), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(5, 8, 17, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.25); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.45); }

    /* Glassmorphism Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      flex-wrap: wrap;
      gap: 16px;
    }
    header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--blue-glow), var(--violet-glow), transparent);
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
      border: 1px solid rgba(255,255,255,0.25);
      animation: pulseGlow 3s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 15px rgba(2, 132, 199, 0.4); }
      100% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.7); }
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      letter-spacing: 0.4px;
      transition: all 0.2s ease;
    }
    .badge-primary {
      background: rgba(56, 189, 248, 0.12);
      color: var(--blue-glow);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
    }
    .badge-success {
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }
    .badge-warning {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .badge-danger {
      background: rgba(244, 63, 94, 0.12);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.35);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
      animation: pulseAnim 1.8s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* Tabs Navigation */
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(16px);
      overflow-x: auto;
    }
    .tab-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      color: #ffffff;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(37, 99, 235, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 4px 16px rgba(14, 165, 233, 0.2);
    }

    /* Action Buttons */
    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-pill:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }
    .btn-pill:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-success {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }

    .btn-danger {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(24px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card:hover {
      border-color: var(--border-accent);
      box-shadow: 0 24px 50px -12px rgba(0, 0, 0, 0.65), 0 0 30px rgba(56, 189, 248, 0.08);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.3px;
    }

    /* =========================================================================
       PCB VIRTUAL BENCH (ENIG EMERALD BOARD)
       ========================================================================= */
    .pcb-board {
      background: linear-gradient(145deg, #061e16 0%, #0a2d21 60%, #051a13 100%);
      border: 2px solid #1a5e46;
      border-radius: 28px;
      padding: 30px 28px;
      position: relative;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), inset 0 0 50px rgba(16, 185, 129, 0.08);
      overflow: hidden;
    }
    .pcb-circuit-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
      z-index: 1;
    }
    .pcb-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      margin-bottom: 26px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      flex-wrap: wrap;
      gap: 12px;
    }
    .pcb-brand-badge {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      color: var(--enig-gold);
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pcb-model-title {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* PCB Components Grid */
    .pcb-components-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 24px;
      position: relative;
      z-index: 10;
      align-items: center;
    }

    /* 1. 3D Tactile Button SW1 */
    .button-3d-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .tactile-housing {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e293b, #090d16);
      border: 4px solid #334155;
      padding: 10px;
      box-shadow: 
        0 20px 35px -5px rgba(0,0,0,0.7),
        0 0 0 1px rgba(255,255,255,0.08),
        inset 0 4px 8px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tactile-housing::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.4), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }
    .tactile-housing:hover::before { opacity: 0.8; }
    .tactile-housing:active, .tactile-housing.pressed {
      transform: translateY(6px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.8), inset 0 6px 12px rgba(0,0,0,0.8);
      border-color: #2563eb;
    }

    .tactile-cap {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #1d4ed8 60%, #1e3a8a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: white;
      font-size: 16px;
      letter-spacing: 0.6px;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.45), inset 0 2px 4px rgba(255,255,255,0.35);
      border: 1px solid rgba(255,255,255,0.25);
      transition: all 0.12s ease;
    }
    .tactile-housing:active .tactile-cap, .tactile-housing.pressed .tactile-cap {
      transform: scale(0.94);
      background: radial-gradient(circle at 50% 50%, #1d4ed8 0%, #1e40af 80%);
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
    }
    .tactile-sublabel {
      font-size: 9px;
      font-family: 'Fira Code', monospace;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* 2. LED Bulb RGB Common Anode */
    .led-bulb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .led-socket {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: radial-gradient(circle, #0f172a 40%, #020617 100%);
      border: 3px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 8px rgba(0,0,0,0.8);
    }
    .led-bulb {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid rgba(255,255,255,0.15);
      position: relative;
      transition: all 0.25s ease;
    }
    .led-bulb.glow-blue {
      background: radial-gradient(circle at 40% 40%, #60a5fa 0%, #2563eb 60%, #1e3a8a 100%);
      box-shadow: 0 0 40px #38bdf8, 0 0 80px rgba(56, 189, 248, 0.6), inset 0 0 15px #93c5fd;
      border-color: #bfdbfe;
    }
    .led-bulb.glow-green {
      background: radial-gradient(circle at 40% 40%, #6ee7b7 0%, #10b981 60%, #064e3b 100%);
      box-shadow: 0 0 40px #34d399, 0 0 80px rgba(52, 211, 153, 0.6), inset 0 0 15px #a7f3d0;
      border-color: #a7f3d0;
    }
    .led-bulb.glow-red {
      background: radial-gradient(circle at 40% 40%, #fca5a5 0%, #ef4444 60%, #7f1d1d 100%);
      box-shadow: 0 0 40px #f87171, 0 0 80px rgba(248, 113, 113, 0.6), inset 0 0 15px #fecaca;
      border-color: #fecaca;
    }
    .led-bulb.glow-yellow {
      background: radial-gradient(circle at 40% 40%, #fef08a 0%, #eab308 60%, #713f12 100%);
      box-shadow: 0 0 40px #facc15, 0 0 80px rgba(250, 204, 21, 0.6), inset 0 0 15px #fef9c3;
      border-color: #fef08a;
    }

    /* 3. Piezo Buzzer */
    .buzzer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .buzzer-casing {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d3748 30%, #1a202c 80%, #000 100%);
      border: 3px solid #4a5568;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 12px 28px rgba(0,0,0,0.6), inset 0 4px 6px rgba(255,255,255,0.1);
    }
    .buzzer-vent {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #000;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.9);
    }
    .buzzer-ring-wave {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      pointer-events: none;
    }
    .buzzer-casing.beeping .buzzer-ring-wave {
      border-color: rgba(245, 158, 11, 0.8);
      animation: buzzerPulse 0.4s infinite ease-out;
    }
    @keyframes buzzerPulse {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* 4. MAX17048 Fuel Gauge Card */
    .gauge-ic-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
      transition: all 0.2s ease;
    }
    .gauge-ic-card:hover {
      border-color: var(--enig-gold);
      box-shadow: 0 12px 30px rgba(226, 183, 20, 0.2);
    }

    /* 5. ESP32-S3 IC Chip View */
    .mcu-chip-box {
      background: linear-gradient(135deg, #18181b, #09090b);
      border: 2px solid #3f3f46;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      position: relative;
    }
    .mcu-chip-box::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #71717a;
    }

    /* Quick Action Gesture Pills */
    .gesture-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
      position: relative;
      z-index: 10;
    }
    .gesture-btn {
      flex: 1;
      min-width: 140px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .gesture-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    /* Pinout Grid */
    .pinout-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-family: 'Fira Code', monospace;
    }
    .pinout-table th {
      text-align: left;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
    }
    .pinout-table td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }
    .pinout-table tr:hover td {
      background: rgba(56, 189, 248, 0.05);
    }
    .pin-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .pin-high { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .pin-low { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .pin-warn { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* Telemetry Terminal */
    .terminal-box {
      background: #020617;
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 16px;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
    }
    .log-line {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      line-height: 1.4;
      word-break: break-all;
    }
    .log-time { color: var(--text-dim); }
    .log-tag { font-weight: 700; border-radius: 4px; padding: 1px 6px; font-size: 10px; }
    .tag-info { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .tag-success { background: rgba(52, 211, 153, 0.2); color: #34d399; }
    .tag-warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .tag-error { background: rgba(244, 63, 94, 0.2); color: #f87171; }
    .tag-crypto { background: rgba(168, 85, 247, 0.2); color: #c084fc; }

    /* Oscilloscope Canvas Box */

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// =========================================================================
// 1. HARDWARE CONFIG & CONSTANTS (MATCHING FIRMWARE & KICAD SCHEMATIC)
// =========================================================================
const HARDWARE_PROFILE = {
  DEVICE_ID: 'BTN-8829-WTR',
  DEVICE_SECRET: 'sec_smart_button_8829_wtr_key_99',
  MCU: 'ESP32-S3-WROOM-1-N8R8',
  FREQUENCY_MHZ: 240,
  VOLTAGE_RAIL: 3.3,
  BATTERY_NOMINAL_MAH: 1500, // CR123A or LiPo
  IC_GAUGE: 'MAX17048G (I2C 0x36)',
  KICAD_REV: 'v4.5.0 Production Ready'
};

// KiCad Netlist & Pinout Mapping Table
const KICAD_PINS_DATA = [
  { pin: 'IO39', net: 'BTN_TRIG', comp: 'SW1', type: 'Input / Pull-up 10k', volt: '3.3V / 0V', desc: 'Tactile Order Button (Active LOW, Wakeup Int)' },
  { pin: 'IO7', net: 'LED_RED', comp: 'D1 (Cathode R)', type: 'Open-Drain / Push-Pull', volt: '3.3V Active LOW', desc: 'RGB LED Red (Error / Battery Critical)' },
  { pin: 'IO6', net: 'LED_GREEN', comp: 'D1 (Cathode G)', type: 'Open-Drain / Push-Pull', volt: '3.3V Active LOW', desc: 'RGB LED Green (Order Success)' },
  { pin: 'IO8', net: 'LED_BLUE', comp: 'D1 (Cathode B)', type: 'Open-Drain / Push-Pull', volt: '3.3V Active LOW', desc: 'RGB LED Blue (WiFi TX / Transmitting)' },
  { pin: 'IO2', net: 'BUZZER_PWM', comp: 'Q1 (2N7002 Gate)', type: 'Digital Output', volt: '3.3V (Gate)', desc: 'Piezo Buzzer Resonant Gate Drive (2.7kHz)' },
  { pin: 'IO4', net: 'I2C_SDA', comp: 'U6 (MAX17048G)', type: 'I2C Open-Drain', volt: '3.3V (Pull-up 4.7k)', desc: 'Fuel Gauge I2C Serial Data Bus' },
  { pin: 'IO5', net: 'I2C_SCL', comp: 'U6 (MAX17048G)', type: 'I2C Open-Drain', volt: '3.3V (Pull-up 4.7k)', desc: 'Fuel Gauge I2C Serial Clock Bus' },
  { pin: 'IO19', net: 'USB_D_N', comp: 'J1 (Type-C Pin A7/B7)', type: 'USB CDC Native', volt: '3.3V High Speed', desc: 'Native USB D- Data' },
  { pin: 'IO20', net: 'USB_D_P', comp: 'J1 (Type-C Pin A6/B6)', type: 'USB CDC Native', volt: '3.3V High Speed', desc: 'Native USB D+ Data' },
  { pin: 'VBAT', net: 'VBAT_RAW', comp: 'BT1 / J2 Header', type: 'Power Rail In', volt: '3.0V - 4.2V', desc: 'Raw Battery Voltage Input (LiPo / CR123A)' },
  { pin: '3V3', net: '+3.3V', comp: 'U1 (ME6211C33 LDO)', type: 'Regulated LDO', volt: '3.30V (Low Dropout)', desc: 'System Core & Peripheral Power Supply' }
];

// Helper to compute HMAC-SHA256 via Web Crypto API
async function computeHmacSha256(keyStr, dataStr) {
  const enc = new TextEncoder();
  const key = await window.crypto.subtle.importKey(
    'raw',
    enc.encode(keyStr),
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['sign']
  );
  const signature = await window.crypto.subtle.sign('HMAC', key, enc.encode(dataStr));
  return Array.from(new Uint8Array(signature))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

// =========================================================================
// 2. ROOT REACT APP
// =========================================================================
function App() {
  const [activeTab, setActiveTab] = useState('bench'); // 'bench' | 'scope' | 'crypto' | 'suite' | 'kicad'
  const [audioEnabled, setAudioEnabled] = useState(true);
  const [backendStatus, setBackendStatus] = useState('edge'); // 'online' | 'edge'

  // Hardware State
  const [sw1Pressed, setSw1Pressed] = useState(false);
  const [ledColor, setLedColor] = useState('OFF'); // 'OFF' | 'BLUE' | 'GREEN' | 'RED' | 'YELLOW'

  // Battery & Fuel Gauge State
  const [cellVoltage, setCellVoltage] = useState(3.87); // in Volts
  const [socPercent, setSocPercent] = useState(88.0);
  
  // Power & Scope State
  const [currentDrawMa, setCurrentDrawMa] = useState(0.015); // 15uA default
  const [powerPhase, setPowerPhase] = useState('Deep Sleep (15µA)');
  
  // Crypto State
  const [nonce, setNonce] = useState('aa13c23a1c09c75d03ba31284543721b');
  const [timestamp, setTimestamp] = useState(Math.floor(Date.now() / 1000));
  const [signature, setSignature] = useState('85e79382f04a96ba5310d65b792b895a17e3b0c9509ec8ec7f3f1e94812a67e0');
  const [showSecret, setShowSecret] = useState(false);
  const [tamperedState, setTamperedState] = useState(false);

  // Automated Test Suite State
  const [testRunning, setTestRunning] = useState(false);
  const [testResults, setTestResults] = useState([]);
  const [testProgress, setTestProgress] = useState(0);

  // Telemetry Console Logs
  const [logs, setLogs] = useState([
    { id: 1, time: '00:00:01', tag: 'BOOT', level: 'info', text: 'ESP32-S3 IoT Hardware Test Bench v4.5.0 đã sẵn sàng.' },
    { id: 2, time: '00:00:02', tag: 'I2C', level: 'success', text: 'MAX17048G Fuel Gauge phát hiện tại địa chỉ I2C 0x36. VCell=3.87V, SOC=88%.' },
    { id: 3, time: '00:00:03', tag: 'SECURITY', level: 'crypto', text: 'HMAC-SHA256 Hardware Accelerator & CSPRNG Nonce Generator initialized.' }
  ]);
  const [logFilter, setLogFilter] = useState('ALL');

  // Web Audio Context for Realistic Piezo Buzzer Sound Synthesis
  const audioCtxRef = useRef(null);

  const addLog = useCallback((tag, text, level = 'info') => {
    const d = new Date();
    const timeStr = d.toTimeString().split(' ')[0] + '.' + String(d.getMilliseconds()).padStart(3, '0');
    setLogs(prev => [
      ...prev.slice(-150),
      { id: Date.now() + Math.random(), time: timeStr, tag, text, level }
    ]);
  }, []);

  // Audio tone generator
  const playTone = useCallback((freq = 2700, duration = 0.08, type = 'square') => {
    if (!audioEnabled) return;
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtxRef.current.state === 'suspended') {
        audioCtxRef.current.resume();
      }
      const osc = audioCtxRef.current.createOscillator();
      const gain = audioCtxRef.current.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtxRef.current.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtxRef.current.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtxRef.current.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtxRef.current.destination);
      osc.start();
      osc.stop(audioCtxRef.current.currentTime + duration);
    } catch (e) {
      console.warn('Audio not available:', e);
    }
  }, [audioEnabled]);

  // Battery recalculation based on Voltage slider
  const handleVoltageChange = (newV) => {

    setCellVoltage(v);
    // Simple ModelGauge LiPo curve approximation
    let soc = 0;
    if (v >= 4.2) soc = 100;
    else if (v <= 3.2) soc = 0;
    else {
      soc = Math.min(100, Math.max(0, Math.round(((v - 3.2) / (4.2 - 3.2)) * 100)));
    }
    setSocPercent(soc);
    addLog('MAX17048', `Điều chỉnh điện áp pin VCell = ${v.toFixed(2)}V -> SOC = ${soc}%`, v < 3.4 ? 'warn' : 'info');
  };

  // Simulate Order Cycle (Single Click)
  const triggerOrderCycle = async () => {
    addLog('INTERRUPT', '⚡ SW1 (IO39) kích hoạt ngắt Active LOW -> ESP32-S3 thức dậy từ Deep Sleep!', 'info');
    setCurrentDrawMa(32);
    setPowerPhase('Thức dậy & Đọc I2C Sensor (32mA)');
    setSw1Pressed(true);
    playTone(1800, 0.04);
    
    setTimeout(async () => {
      setSw1Pressed(false);
      // Turn on Blue LED (WiFi TX)

      setCurrentDrawMa(240);
      setPowerPhase('Phát WiFi RF & Ký HMAC-SHA256 (240mA)');
      
      const newNonce = Array.from(window.crypto.getRandomValues(new Uint8Array(16)))
        .map(b => b.toString(16).padStart(2, '0')).join('');
      const newTs = Math.floor(Date.now() / 1000);
      const payload = `${HARDWARE_PROFILE.DEVICE_ID}:${newTs}:${newNonce}:{"action":"CALL_SERVICE","btn":"SW1","vcell":${cellVoltage}}`;
      const newSig = await computeHmacSha256(HARDWARE_PROFILE.DEVICE_SECRET, payload);
      
      setNonce(newNonce);
      setTimestamp(newTs);
      setSignature(newSig);
      setTamperedState(false);
      
      addLog('CRYPTO', `Chữ ký phần cứng sinh thành công: ${newSig.substring(0, 16)}...`, 'crypto');
      addLog('NETWORK', 'Đang truyền gói tin bảo mật đến Gateway API...', 'info');

    const newTs = Math.floor(Date.now() / 1000);

    const newSig = await computeHmacSha256(HARDWARE_PROFILE.DEVICE_SECRET, payload);
    setNonce(newNonce);
    setTimestamp(newTs);

    setTimeout(() => {

      setCurrentDrawMa(0.015);
      setPowerPhase('Deep Sleep (15µA)');
      addLog('GATEWAY', '✔ HTTP 200 OK — Đã hủy đơn hàng thành công.', 'success');
    }, 1500);
  };

  // Simulate Tamper Attack Defense
  const triggerTamperDefense = async () => {
    addLog('ATTACK', '⚠️ Đang giả lập tấn công Sửa Đổi Gói Tin (Data Tampering Attack)...', 'warn');
    const forgedPayload = `${HARDWARE_PROFILE.DEVICE_ID}:${timestamp}:${nonce}:{"action":"COMPROMISED_PAYLOAD"}`;
    const forgedSig = await computeHmacSha256('ATTACKER_INVALID_SECRET', forgedPayload);
    
    setSignature(forgedSig);
    setTamperedState(true);
    setLedColor('RED');
    setBuzzerActive(true);
    playTone(850, 0.3, 'sawtooth');
    
    addLog('DEFENSE', '🛡️ PHÒNG THỦ THÀNH CÔNG: Chữ ký không khớp với khóa bí mật phần cứng! Gateway trả về HTTP 401 Unauthorized!', 'error');

      setTamperedState(false);

  };

  // Run 10 Automated Hardware Test Steps

      { name: 'Khởi động nguồn & LDO 3.3V (ME6211C33)', duration: 180, tag: 'PWR' },

  // Check Backend NestJS on startup

// =========================================================================
// 3. OSCILLOSCOPE CANVAS COMPONENT (60 FPS PHOSPHOR SIMULATION)
// =========================================================================
function OscilloscopeCanvas({ currentMa }) {
  const canvasRef = useRef(null);
  const dataRef = useRef(new Array(160).fill(2));
  const smoothMaRef = useRef(currentMa);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let animId;

    const render = () => {
      smoothMaRef.current += (currentMa - smoothMaRef.current) * 0.15;
      const normY = Math.min(140, (smoothMaRef.current / 250) * 130 + (Math.random() * 2));
      
      dataRef.current.push(normY);
      dataRef.current.shift();

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid Lines
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let y = 20; y < canvas.height; y += 25) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
      }
      for (let x = 40; x < canvas.width; x += 50) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
      }
      ctx.stroke();

      // Waveform phosphor line
      ctx.strokeStyle = smoothMaRef.current > 100 ? '#38bdf8' : '#34d399';
      ctx.shadowColor = smoothMaRef.current > 100 ? '#38bdf8' : '#34d399';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      const step = canvas.width / (dataRef.current.length - 1);
      for (let i = 0; i < dataRef.current.length; i++) {
        const x = i * step;
        const y = canvas.height - dataRef.current[i] - 12;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      animId = requestAnimationFrame(render);
    };

    animId = requestAnimationFrame(render);
    return () => cancelAnimationFrame(animId);
  }, [currentMa]);

  return (
    <div className="scope-box">
      <canvas ref={canvasRef} width={800} height={180} className="scope-canvas" />
    </div>
  );
}
