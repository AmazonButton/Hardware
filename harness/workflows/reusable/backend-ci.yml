# Reusable Workflow: Backend CI
# =============================================================================
# Runs Java/Spring Boot CI: tests, build, optional coverage, optional OWASP scan
#
# Usage:
#   jobs:
#     backend:
#       uses: ./.github/workflows/reusable/backend-ci.yml
#       with:
#         java-version: '21'
#         working-directory: 'backend'
#       secrets: inherit
# =============================================================================
name: Backend CI (Reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        type: string
        default: '21'
      working-directory:
        description: 'Backend project directory'
        type: string
        default: 'backend'
      run-owasp:
        description: 'Run OWASP Dependency Check'
        type: boolean
        default: false
      run-coverage:
        description: 'Generate JaCoCo coverage report'
        type: boolean
        default: false
    secrets:
      DB_URL:
        required: false
      DB_USER:
        required: false
      DB_PASS:
        required: false
      JWT_SECRET:
        required: false

jobs:
  backend-ci:
    name: "🛠️ Backend CI (Java ${{ inputs.java-version }})"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: ${{ inputs.working-directory }}

      - name: Run unit tests
        run: ./mvnw test -DfailIfNoTests=false
        working-directory: ${{ inputs.working-directory }}
        env:
          DB_URL: ${{ secrets.DB_URL || 'jdbc:postgresql://localhost:5432/app_test' }}
          DB_USER: ${{ secrets.DB_USER || 'postgres' }}
          DB_PASS: ${{ secrets.DB_PASS || 'test_password' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-key-minimum-32-chars-long' }}

      - name: Generate coverage report
        if: ${{ inputs.run-coverage }}
        run: ./mvnw jacoco:report -DskipTests
        working-directory: ${{ inputs.working-directory }}
        env:
          DB_URL: jdbc:postgresql://localhost:5432/app_test
          DB_USER: postgres
          DB_PASS: test_password

      - name: Upload coverage report
        if: ${{ inputs.run-coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: ${{ inputs.working-directory }}/target/site/jacoco/
          retention-days: 7

      - name: OWASP Dependency Check
        if: ${{ inputs.run-owasp }}
        run: ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9
        working-directory: ${{ inputs.working-directory }}
        env:
          DB_URL: jdbc:postgresql://localhost:5432/app_test
          DB_USER: postgres
          DB_PASS: test_password

      - name: Build JAR (skip tests)
        run: ./mvnw package -DskipTests -q
        working-directory: ${{ inputs.working-directory }}
        env:
          DB_URL: jdbc:postgresql://localhost:5432/app_test
          DB_USER: postgres
          DB_PASS: test_password
          JWT_SECRET: test-secret-key-minimum-32-chars-long

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ${{ inputs.working-directory }}/target/*.jar
          retention-days: 7
